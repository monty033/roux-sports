name: release

# Tag-triggered release: build the signed APK from the tagged commit and publish it on the public
# GitHub mirror, which is where direct downloads and Obtainium read from. The Forgejo instance is
# LAN-only, so a release here is the record of what was built; the GitHub release is the download.
#
# Order matters and is the point of the workflow:
#   1. preflight refuses a tag that is not on main, does not match versionName, or names a commit with
#      no successful gate run. Nothing is built or published from a commit that has not passed.
#   2. build restores the keystore from secrets, runs the repository's own release script, and checks the
#      signer against a pinned certificate digest.
#   3. publish runs in its own step with its own environment, holding only the GitHub token. It runs no
#      repository script, so nothing from the tagged commit executes with that token in scope.
#   4. the uploaded APK is downloaded again and compared, so a corrupt upload fails the run instead of
#      becoming a release people install.
#
# Secrets this needs (Forgejo; user-level secrets are visible to both repositories):
#   RELEASE_PUBLISH_TOKEN   GitHub token with contents:write on the mirror
#   RELEASE_KEYSTORE_B64    base64 of the release .jks
#   RELEASE_STORE_PASSWORD  keystore password
#   RELEASE_KEY_PASSWORD    key password
#   RELEASE_KEY_ALIAS       key alias (optional; read out of the keystore when absent)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v1.0.0
        required: true

concurrency:
  # Two runs for one tag would race on the same release assets. Never cancel a run in flight: a
  # half-published release is worse than a slow one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_PACKAGE: net.montycasa.roux
  GITHUB_MIRROR: monty033/roux-sports
  # The certificate this project ships. A release signed by anything else is not ours, so the build
  # step fails rather than publishing it. Rotating the signing key means changing this line.
  EXPECTED_CERT_SHA256: 6dd177eef48595e217cc660a72fcb05ca4eae4979d1484936941b01721893a21

jobs:
  release:
    runs-on: nixos
    timeout-minutes: 90
    steps:
      - name: Check out the tagged commit with its history
        uses: actions/checkout@v4
        with:
          # The ancestry check needs main, not just the tag's tree.
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Preflight
        # Read-only. Refuses before any secret is in scope.
        env:
          # Forgejo's automatic token, read-only here. GITHUB_TOKEN is blanked so a repository script
          # cannot pick it up out of the environment.
          GITHUB_TOKEN: ""
          FORGEJO_TOKEN: ""
          FORGEJO_READ_TOKEN: ${{ github.token }}
          RUNS_URL: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/runs
        run: |
          set -euo pipefail

          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          printf 'tag\t%s\ncommit\t%s\n' "$TAG" "$GITHUB_SHA"

          # 1. The tag names a version the app actually carries.
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)"
          [ -n "$VERSION_NAME" ] || { echo "could not read versionName"; exit 1; }
          if [ "v$VERSION_NAME" != "$TAG" ]; then
            echo "tag $TAG does not match versionName $VERSION_NAME"; exit 1
          fi
          echo "versionName matches: $VERSION_NAME"

          # 2. The tagged commit is on main. A tag on a side branch is an accident, not a release.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "commit $GITHUB_SHA is not on main"; exit 1
          fi
          echo "commit is on main"

          # 3. That commit passed the gate. The gate workflow is the same command a person runs, and a
          # release is not the place to discover it did not.
          curl -sS -H "Authorization: token $FORGEJO_READ_TOKEN" \
            "$RUNS_URL?limit=50" -o "$RUNNER_TEMP/runs.json"
          PY="$(command -v python3 || true)"
          if [ -z "$PY" ]; then
            PY="$(nix develop --command bash -c 'command -v python3')"
          fi
          printf '%s\n' "$PY" > "$RUNNER_TEMP/py.path"
          "$PY" - "$GITHUB_SHA" "$RUNNER_TEMP/runs.json" <<'PY'
          import json, sys
          sha, path = sys.argv[1], sys.argv[2]
          runs = json.load(open(path)).get("workflow_runs") or []
          mine = [r for r in runs if r.get("head_sha") == sha]
          ok = [r for r in mine if r.get("conclusion") == "success"]
          print("runs for commit:", len(mine), "successful:", len(ok))
          if not ok:
              sys.exit("no successful workflow run for this commit; refusing to release")
          PY
          echo "gate run found"

      - name: Build the signed release
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          # Nothing in this step needs repository write access.
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "RELEASE_KEYSTORE_B64 is not set"; exit 1; }
          [ -n "$STORE_PASSWORD" ] || { echo "RELEASE_STORE_PASSWORD is not set"; exit 1; }

          KEYSTORE="$RUNNER_TEMP/release.jks"
          # 0600 before the bytes land in it.
          ( umask 077; printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE" )
          chmod 600 "$KEYSTORE"

          ALIAS="$KEY_ALIAS"
          if [ -z "$ALIAS" ]; then
            ALIAS="$(nix develop --command keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" \
              | sed -n 's/^\([^,]*\),.*PrivateKeyEntry.*/\1/p' | head -1)"
          fi
          [ -n "$ALIAS" ] || { echo "could not determine the key alias"; exit 1; }

          (
            umask 077
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE" "$STORE_PASSWORD" "$ALIAS" "$KEY_PASSWORD" > keystore.properties
          )
          chmod 600 keystore.properties

          nix develop --command ./scripts/build-release.sh

          # The script proves the APK is signed; this proves it is signed by us.
          APK="$(find app/build/dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo "no APK in app/build/dist"; exit 1; }
          DIGEST="$(nix develop --command apksigner verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          printf 'certificate\ts%s\n' "$DIGEST"
          if [ "$DIGEST" != "$EXPECTED_CERT_SHA256" ]; then
            echo "APK is signed by an unexpected certificate"; exit 1
          fi
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk.sha256"

      - name: Remove the key material
        if: always()
        run: |
          set -uo pipefail
          for f in "$RUNNER_TEMP/release.jks" keystore.properties; do
            if [ -f "$f" ]; then
              # Overwrite before unlinking: a build artifact may be uploaded with the workspace, and a
              # deleted file whose bytes are still on disk is not deleted for our purposes.
              shred -u "$f" 2>/dev/null || rm -f "$f"
            fi
          done
          rm -f "$RUNNER_TEMP/apk.sha256"
          echo "key material removed; anything keystore-shaped left in the workspace:"
          find . -maxdepth 1 -iname '*keystore*' -print | sed 's/^/  /' | grep . || echo "  none"

      - name: Publish to the GitHub mirror
        # Holds the GitHub token and nothing else. No repository script runs here: the tools come from a
        # fixed PATH, and the only inputs are files this run produced.
        env:
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_PUBLISH_TOKEN" ] || { echo "RELEASE_PUBLISH_TOKEN is not set"; exit 1; }
          PY="$(cat "$RUNNER_TEMP/py.path")"

          API="https://api.github.com/repos/$GITHUB_MIRROR"
          auth=(-H "Authorization: Bearer $RELEASE_PUBLISH_TOKEN" -H "Accept: application/vnd.github+json")

          APK="$(find app/build/dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo "no APK in app/build/dist"; exit 1; }
          SUM="$APK.sha256"
          [ -f "$SUM" ] || { echo "no checksum beside $APK"; exit 1; }

          # Create the release, or reuse the one a previous attempt made for this tag.
          CODE="$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' "${auth[@]}" \
            -X POST "$API/releases" -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"$GITHUB_SHA\",\"name\":\"Roux Sports ${TAG#v}\",\"draft\":false,\"prerelease\":false}")"
          if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
            curl -sS -o "$RUNNER_TEMP/release.json" "${auth[@]}" "$API/releases/tags/$TAG"
          fi
          RID="$("$PY" -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/release.json")"
          echo "release id: $RID"

          upload() {
            local file="$1" name="$2" code
            # An asset with this name from an earlier attempt would 422; remove it first.
            EXISTING="$("$PY" - "$RUNNER_TEMP/release.json" "$name" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          for asset in data.get("assets") or []:
              if asset.get("name") == sys.argv[2]:
                  print(asset["id"])
                  break
          PY
          )"
            if [ -n "$EXISTING" ]; then
              curl -sS -o /dev/null "${auth[@]}" -X DELETE "$API/releases/assets/$EXISTING"
            fi
            code="$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" \
              -X POST "$API/releases/$RID/assets?name=$name" \
              -H 'Content-Type: application/octet-stream' --data-binary "@$file")"
            echo "upload $name -> $code"
            case "$code" in 200|201) ;; *) echo "upload of $name failed"; exit 1 ;; esac
          }

          upload "$APK" "$(basename "$APK")"
          upload "$SUM" "$(basename "$SUM")"

          # Download what we just published and compare it with what we built.
          URL="https://github.com/$GITHUB_MIRROR/releases/download/$TAG/$(basename "$APK")"
          curl -sSL -o "$RUNNER_TEMP/published.apk" "$URL"
          LOCAL_SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          REMOTE_SHA="$(sha256sum "$RUNNER_TEMP/published.apk" | cut -d' ' -f1)"
          printf 'local\t%s\nremote\t%s\n' "$LOCAL_SHA" "$REMOTE_SHA"
          [ "$LOCAL_SHA" = "$REMOTE_SHA" ] || { echo "published bytes differ from the build"; exit 1; }
          rm -f "$RUNNER_TEMP/published.apk"

          echo "published: https://github.com/$GITHUB_MIRROR/releases/tag/$TAG"
