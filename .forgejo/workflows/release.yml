name: release

# Tag-triggered release: build the signed APK from the tagged commit and publish it on the public
# GitHub mirror, which is where direct downloads and Obtainium read from. The Forgejo instance is
# LAN-only, so a release here is the record of what was built; the GitHub release is the download.
#
# Order matters and is the point of the workflow:
#   1. resolve the target, so a manual dispatch releases the tag it checked out and not the branch the
#      dispatch was fired from.
#   2. preflight refuses a tag that is not on main, does not match versionName, or names a commit with
#      no successful gate run. Nothing is built or published from a commit that has not passed.
#   3. build restores the keystore from secrets, runs the repository's own release script, and checks the
#      signer against a pinned certificate digest.
#   4. publish runs in its own step with its own environment, holding only the GitHub token. It resolves
#      its tools from a fixed PATH and runs no repository script, so nothing from the tagged commit
#      executes with that token in scope.
#   5. the release is created as a draft, both assets are uploaded and read back for comparison, and only
#      then is it published. A corrupt upload therefore cannot go live.
#   6. mirror uploads the same artifact bytes to this repository, so the private record and the public
#      download name the same file. It does not rebuild: a second build of one commit has a different
#      digest, which would leave two legitimate-looking APKs with different checksums for one version.
#
# Secrets this needs (Forgejo user-level secrets are visible to both repositories):
#   RELEASE_PUBLISH_TOKEN   GitHub token with contents:write on the mirror
#   RELEASE_KEYSTORE_B64    base64 of the release .jks
#   RELEASE_STORE_PASSWORD  keystore password
#   RELEASE_KEY_PASSWORD    key password
#   RELEASE_KEY_ALIAS       key alias (optional; read out of the keystore when absent)
#
# Known limitation, stated rather than hidden: a push trigger runs the workflow file from the ref being
# built, so whoever can create a tag can also supply the workflow that handles these secrets. Restrict
# who may create release tags (Forgejo tag protection) or move release automation to a ref tags cannot
# override.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v1.0.0
        required: true
        type: string

concurrency:
  # Keyed on the tag itself, so a tag push and a manual dispatch for the same tag serialise instead of
  # racing on the same release assets. Never cancel: a half-published release is worse than a slow one.
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_PACKAGE: net.montycasa.roux
  GITHUB_MIRROR: monty033/roux-sports
  # The certificate this project ships. A release signed by anything else is not ours, so the build step
  # fails rather than publishing it. Rotating the signing key means changing this line.
  #
  # Pinned on purpose, and never read from keystore.properties: a value derived from the keystore under test
  # would agree with any key, including an attacker's. This is the one place the identity is asserted from
  # outside the build. Current key: CN=Roux Sports, OU=Roux Sports, O=Roux Sports, C=US, valid to 2056.
  EXPECTED_CERT_SHA256: 2f9febb780c626151ba4b3492e14211678ab4ff0cf611272ba2216a12c8d4f9f

jobs:
  build:
    runs-on: nixos
    timeout-minutes: 90
    steps:
      - name: Check out the release target
        uses: actions/checkout@v4
        with:
          # The ancestry check needs main, not just the tag's tree.
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Check the workflow's own scripts parse
        # A missing continuation line in the publisher is invisible to YAML and to actionlint, and it only
        # surfaces after the build finishes, when the runner refuses to parse the script it was handed. This
        # runs in seconds and fails the release before anything is built.
        run: |
          set -eu
          scripts/check-workflow-scripts.sh .forgejo/workflows/release.yml

      - name: Resolve the target
        # The tag comes from the event, so it is untrusted input: it is passed in the environment (never
        # spliced into shell source) and validated against a strict shape before anything uses it.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TAG_EVENT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          # A dispatch carries the tag as an input; a tag push carries it in the ref. The choice is made in
          # shell on purpose: this instance's expression engine mangles `a && b || c`, and it mangled it
          # into a literal string that made the checkout fail with a ref of "%!t(string=v1.0.0)".
          # The dispatch input arrives under one of two names in this instance and the other is empty.
          INPUT_TAG="${INPUT_TAG:-${INPUT_TAG_EVENT:-}}"
          if [ -n "$INPUT_TAG" ]; then
            REQUESTED_TAG="$INPUT_TAG"
          else
            REQUESTED_TAG="${GITHUB_REF_NAME:?neither a tag input nor a ref name}"
          fi
          case "$REQUESTED_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing tag that is not v<major>.<minor>.<patch>: $REQUESTED_TAG"; exit 1 ;;
          esac
          case "$REQUESTED_TAG" in
            *[!0-9A-Za-z._-]*) echo "refusing tag with unexpected characters: $REQUESTED_TAG"; exit 1 ;;
          esac
          # A dispatch checks out the branch it was fired from, so the tag is fetched and checked out here
          # rather than assumed. A tag push is already on the tag.
          if [ -n "${INPUT_TAG:-}" ]; then
            git fetch --quiet --depth=1 origin "refs/tags/$REQUESTED_TAG"
            git checkout --quiet FETCH_HEAD
            echo "checked out $REQUESTED_TAG at $(git rev-parse --short=8 HEAD)"
          fi
          # The checked-out tag resolved to a commit. A manual dispatch passes a tag input, but the
          # event's own SHA belongs to the branch it was fired from, so the commit is read from git.
          SHA="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short=8 HEAD)"
          {
            printf 'TARGET_TAG=%s\n' "$REQUESTED_TAG"
            printf 'TARGET_SHA=%s\n' "$SHA"
          } >> "$GITHUB_ENV"
          printf 'tag\t%s\ncommit\t%s\n' "$REQUESTED_TAG" "$SHORT"

      - name: Check the tools this needs
        # node and curl come from the runner's PATH, which is what the NookBridge release workflow in this
        # organisation already relies on. Deliberately not `nix develop`: that evaluates the flake of the
        # tag being released, so a tag whose tree predates a tool could never be released - which is
        # exactly what blocked v1.0.0 - and its failures arrive as a mute exit code under `set -e`.
        run: |
          set -eu
          NODE="$(command -v node || true)"
          CURL="$(command -v curl || true)"
          [ -n "$NODE" ] || { echo "node is not on this runner's PATH"; exit 1; }
          [ -n "$CURL" ] || { echo "curl is not on this runner's PATH"; exit 1; }
          printf 'node\t%s\ncurl\t%s\n' "$NODE" "$CURL"
          {
            printf 'NODE=%s\n' "$NODE"
            printf 'CURL=%s\n' "$CURL"
          } >> "$GITHUB_ENV"

      - name: Preflight
        # Read-only. Refuses before any secret is in scope.
        env:
          # Both well-known token names are blanked so a repository script cannot pick one up out of the
          # environment; only the read-only copy below is in scope.
          GITHUB_TOKEN: ""
          FORGEJO_TOKEN: ""
          FORGEJO_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 1. The tag names a version the app actually carries.
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)"
          [ -n "$VERSION_NAME" ] || { echo "could not read versionName"; exit 1; }
          if [ "v$VERSION_NAME" != "$TARGET_TAG" ]; then
            echo "tag $TARGET_TAG does not match versionName $VERSION_NAME"; exit 1
          fi
          echo "versionName matches: $VERSION_NAME"

          # 1b. The name and the code follow the date rule, and the code is the one the name implies.
          # scripts/check-version.sh owns the rule; the release build checks the same thing on the APK.
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*$/\1/p' app/build.gradle.kts | head -1)"
          [ -n "$VERSION_CODE" ] || { echo "could not read versionCode"; exit 1; }
          ./scripts/check-version.sh "$VERSION_NAME" "$VERSION_CODE"

          # 1c. The code must exceed every release already tagged, or an install would refuse the
          # update. The checkout has full history and tags, so this is the real record rather than a
          # file that can drift.
          # Skipped by commit, not by name: a tag that was force-moved to this commit is the release
          # being cut, but one that still points elsewhere is an earlier release that must be beaten.
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          PREV=""
          while read -r tag; do
            [ -n "$tag" ] || continue
            [ "$(git rev-parse "$tag^{commit}" 2>/dev/null)" = "$RELEASE_COMMIT" ] && continue
            c="$(git cat-file -p "$tag:app/build.gradle.kts" 2>/dev/null \
              | sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' | head -1)"
            [ -n "$c" ] && PREV="$PREV$c $tag\n"
          done < <(git tag -l 'v[0-9]*' --merged HEAD)
          HIGHEST="$(printf "%b" "$PREV" | sort -n | tail -1)"
          if [ -n "$HIGHEST" ]; then
            PREV_CODE="${HIGHEST%% *}"
            PREV_TAG="${HIGHEST##* }"
            echo "highest earlier release: $PREV_TAG code $PREV_CODE"
            if [ "$VERSION_CODE" -le "$PREV_CODE" ]; then
              echo "versionCode $VERSION_CODE does not exceed $PREV_CODE from $PREV_TAG"; exit 1
            fi
          fi

          # 1d. The changelog for this version code exists and has been written.
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
          [ -f "$CHANGELOG" ] || { echo "missing $CHANGELOG"; exit 1; }
          if head -1 "$CHANGELOG" | grep -q '^TODO'; then
            echo "$CHANGELOG still contains the TODO placeholder"; exit 1
          fi
          echo "changelog present: $CHANGELOG"

          # 2. The tagged commit is on main. A tag on a side branch is an accident, not a release.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$TARGET_SHA" FETCH_HEAD; then
            echo "commit $TARGET_SHA is not on main"; exit 1
          fi
          echo "commit is on main"

          # 3. That commit passed the gate.
          #
          # Tools are resolved here rather than inherited from an earlier step: an inherited value that
          # is empty fails silently under `set -e`, which is exactly how this step used to die with no
          # output. Each phase below announces itself, so a failure names its own line.
          NODE="$(command -v node || true)"
          CURL="$(command -v curl || true)"
          echo "node=[$NODE] curl=[$CURL]"
          [ -n "$NODE" ] || { echo "node is not on this runner's PATH"; exit 1; }
          [ -n "$CURL" ] || { echo "curl is not on this runner's PATH"; exit 1; }

          # The instance answers on a LAN address over http, so the scheme is whatever this run reports;
          # the GitHub calls further down stay https only.
          URLS="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/runs"
          case "$URLS" in
            http://*|https://*) ;;
            *) echo "unusable server url: $URLS"; exit 1 ;;
          esac
          echo "runs url: $URLS"

          FOUND=0
          for page in 1 2 3 4 5 6 7 8; do
            CODE="$("$CURL" -q -sS --proto =http,https -o "$RUNNER_TEMP/runs.json" -w '%{http_code}' \
              -H "Authorization: token $FORGEJO_READ_TOKEN" "$URLS?limit=50&page=$page")" || {
                echo "curl failed reading page $page"; exit 1; }
            echo "page $page: http $CODE"
            if [ "$CODE" != "200" ]; then
              echo "the runs API answered $CODE, not 200"; head -c 200 "$RUNNER_TEMP/runs.json" || true; exit 1
            fi
            read -r COUNT HIT < <(RUNS_JSON="$RUNNER_TEMP/runs.json" GATE_SHA="$TARGET_SHA" "$NODE" <<'NODE'
          const fs = require('fs');
          const runs = JSON.parse(fs.readFileSync(process.env.RUNS_JSON, 'utf8')).workflow_runs || [];
          const hit = runs.filter((r) =>
            r.workflow_id === 'gate.yml' &&
            r.commit_sha === process.env.GATE_SHA &&
            r.status === 'success').length;
          // A newline matters: `read` reports failure at EOF without one, and under `set -e`
          // that aborted this step silently, one line before the page report.
          process.stdout.write(`${runs.length} ${hit}\n`);
          NODE
            ) || true
            echo "page $page: runs=$COUNT successful_gate_runs=$HIT"
            if [ "${HIT:-0}" -gt 0 ]; then FOUND=1; break; fi
            if [ "${COUNT:-1}" -eq 0 ]; then echo "no gate run for this commit"; exit 1; fi
          done
          if [ "$FOUND" -ne 1 ]; then
            echo "no successful gate run for this commit in 400 runs"; exit 1
          fi
          echo "gate run found"

      - name: Build the signed release
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          # Nothing in this step needs repository or forge write access.
          GITHUB_TOKEN: ""
          FORGEJO_TOKEN: ""
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "RELEASE_KEYSTORE_B64 is not set"; exit 1; }
          [ -n "$STORE_PASSWORD" ] || { echo "RELEASE_STORE_PASSWORD is not set"; exit 1; }

          KEYSTORE="$RUNNER_TEMP/release.jks"
          # 0600 before the bytes land in it.
          ( umask 077; printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE" )
          chmod 600 "$KEYSTORE"

          ALIAS="$KEY_ALIAS"
          if [ -z "$ALIAS" ]; then
            ALIAS="$(nix develop --command keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" \
              | sed -n 's/^\([^,]*\),.*PrivateKeyEntry.*/\1/p' | head -1)"
          fi
          [ -n "$ALIAS" ] || { echo "could not determine the key alias"; exit 1; }

          (
            umask 077
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE" "$STORE_PASSWORD" "$ALIAS" "$KEY_PASSWORD" > keystore.properties
          )
          chmod 600 keystore.properties

          nix develop --command ./scripts/build-release.sh

          # The script proves the APK is signed; this proves it is signed by us.
          APK="$(find app/build/dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo "no APK in app/build/dist"; exit 1; }
          DIGEST="$(nix develop --command apksigner verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          printf 'certificate\t%s\n' "$DIGEST"
          if [ "$DIGEST" != "$EXPECTED_CERT_SHA256" ]; then
            echo "APK is signed by an unexpected certificate"; exit 1
          fi
          sha256sum "$APK"

      - name: Remove the key material
        if: always()
        run: |
          set -uo pipefail
          failed=0
          for f in "$RUNNER_TEMP/release.jks" keystore.properties; do
            if [ -e "$f" ]; then
              shred -u "$f" 2>/dev/null || rm -f "$f"
              if [ -e "$f" ]; then
                echo "could not remove $f"
                failed=1
              fi
            fi
          done
          left="$(find "$RUNNER_TEMP" . -maxdepth 1 -iname '*keystore*' -print 2>/dev/null | grep . || true)"
          if [ -n "$left" ]; then
            echo "key-shaped files still present:"
            printf '%s\n' "$left"
            failed=1
          fi
          if [ "$failed" -eq 0 ]; then echo "key material removed"; else exit 1; fi

      - name: Hand the artifact to the publish job
        # The Forgejo-hosted v3 action, not actions/upload-artifact@v4: the v4 action was probed on this
        # runner and failed, while this one round-tripped a file between two jobs.
        # The APK crosses a job boundary so the token-bearing job never shares a process environment with
        # the step that runs code from the tagged commit. The checksum is recomputed on the other side.
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: release-apk
          path: app/build/dist/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    # A separate job on purpose. It starts with an empty environment file, so nothing the build step wrote
    # to it - BASH_ENV, PATH additions, LD_PRELOAD, proxy settings - exists here to be inherited. Belt and
    # braces, the shell that runs this job's steps is also given an empty BASH_ENV and ENV.
    needs: build
    runs-on: nixos
    timeout-minutes: 20
    env:
      BASH_ENV: ""
      ENV: ""
    steps:
      - name: Check out the tag itself
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Resolve the target from the fresh checkout
        # Read from git in this job, not carried over from the build: the commit being published is the one
        # this job checked out, so there is nothing for an earlier step to substitute.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TAG_EVENT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          # Same reason as the build job: the tag comes from the input or the ref, decided in shell, because
          # the expression engine here mangles the combined form.
          INPUT_TAG="${INPUT_TAG:-${INPUT_TAG_EVENT:-}}"
          if [ -n "$INPUT_TAG" ]; then
            REQUESTED_TAG="$INPUT_TAG"
            git fetch --quiet --depth=1 origin "refs/tags/$REQUESTED_TAG"
            git checkout --quiet FETCH_HEAD
            echo "checked out $REQUESTED_TAG at $(git rev-parse --short=8 HEAD)"
          else
            REQUESTED_TAG="${GITHUB_REF_NAME:?neither a tag input nor a ref name}"
          fi
          case "$REQUESTED_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing tag that is not v<major>.<minor>.<patch>: $REQUESTED_TAG"; exit 1 ;;
          esac
          {
            printf 'TARGET_TAG=%s\n' "$REQUESTED_TAG"
            printf 'TARGET_SHA=%s\n' "$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          printf 'tag\t%s\ncommit\t%s\n' "$REQUESTED_TAG" "$(git rev-parse --short=8 HEAD)"

      - name: Check the tools this needs
        # Same tools, resolved in this job rather than inherited: a job boundary is a real boundary, so
        # nothing the build wrote into its environment file exists here.
        run: |
          set -eu
          NODE="$(command -v node || true)"
          CURL="$(command -v curl || true)"
          [ -n "$NODE" ] || { echo "node is not on this runner's PATH"; exit 1; }
          [ -n "$CURL" ] || { echo "curl is not on this runner's PATH"; exit 1; }
          printf 'node\t%s\ncurl\t%s\n' "$NODE" "$CURL"
          {
            printf 'NODE=%s\n' "$NODE"
            printf 'CURL=%s\n' "$CURL"
          } >> "$GITHUB_ENV"

      - name: Fetch the built APK
        uses: https://data.forgejo.org/actions/download-artifact@v3
        with:
          name: release-apk
          path: dist

      - name: Publish to the GitHub mirror
        # Holds the GitHub token and nothing else. An explicit PATH replaces the runner's own, so a
        # directory an earlier step added to GITHUB_PATH is not searched, and no repository script runs
        # here: the token cannot reach code from the tagged commit through this step's environment.
        env:
          # The only variable this step's shell is given. The publisher itself runs under `env -i` with an
          # explicit list, so nothing inherited from the build step reaches it.
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          # The publisher is written out first, then run with an empty environment. Forgejo carries
          # environment updates from an earlier step into later ones, and the build step runs code from the
          # tagged commit, so anything it writes there - LD_PRELOAD, a proxy, a curl config - would
          # otherwise be inherited by the process that holds the publish token. This list is the entire
          # environment the publisher gets.
          SCRIPT="$RUNNER_TEMP/publish.sh"
          ( umask 077; cat > "$SCRIPT" <<'PUBLISH'
                    # Tools come from the PATH this job was given. That path is trustworthy here for a
                    # reason worth naming: the build runs in a different job, and a job boundary is a
                    # proven barrier - a probe wrote a variable into the build's environment file and this
                    # job could not see it.
                    [ -n "${NODE:-}" ] && [ -x "$NODE" ] || { echo "NODE is not set to an executable"; exit 1; }
                    [ -n "${CURL:-}" ] && [ -x "$CURL" ] || { echo "CURL is not set to an executable"; exit 1; }
                    SHA="sha256sum"

                    # Run from outside the checkout and use -I. Python puts the current directory on sys.path for
                    # -c, and imports sitecustomize at startup, so a tagged json.py or sitecustomize.py would
                    # otherwise run inside this step with the publish token in its environment.
                    WORKSPACE="$GITHUB_WORKSPACE"
                    [ -n "$WORKSPACE" ] || { echo "GITHUB_WORKSPACE is not set"; exit 1; }
                    cd "$RUNNER_TEMP"

                    API="https://api.github.com/repos/$GITHUB_MIRROR"
                    auth=(-H "Authorization: Bearer $RELEASE_PUBLISH_TOKEN" -H "Accept: application/vnd.github+json")

                    APK="$(find "$WORKSPACE/dist" -maxdepth 1 -type f -name '*.apk' -print -quit)"
                    [ -n "$APK" ] || { echo "no APK in app/build/dist"; exit 1; }
                    [ -f "$APK" ] || { echo "no APK at $APK"; exit 1; }
                    [ ! -L "$APK" ] || { echo "the APK is a symlink; refusing to upload it"; exit 1; }
                    # The built file names the version it carries, so it is a second, cheap check that the
                    # artifact and the tag describe the same release.
                    if [ "$(basename "$APK")" != "roux-sports-${TARGET_TAG#v}.apk" ]; then
                      echo "APK name $(basename "$APK") does not match tag $TARGET_TAG"
                      exit 1
                    fi
                    # The sidecar is not trusted: a symlink there could point at this process's own environment and
                    # be uploaded as the checksum. The checksum is computed from the APK and written here instead.
                    SUM="$RUNNER_TEMP/$(basename "$APK").sha256"
                    "$SHA" "$APK" | sed "s| .*|  $(basename "$APK")|" > "$SUM"
                    cat "$SUM"

                    # If the mirror already has this tag, it must point at the commit that was built. A push mirror
                    # that is behind, or a tag pointing elsewhere, would publish an APK for the wrong source.
                    TAG_CODE="$("$CURL" -q -sS --proto =https --proto-redir =https -o "$RUNNER_TEMP/tag.json" -w '%{http_code}' "${auth[@]}" \
                      "$API/git/ref/tags/$TARGET_TAG")"
                    if [ "$TAG_CODE" = "200" ]; then
                      # The ref may point at the commit (lightweight tag) or at a tag object (annotated tag); peel
                      # it, or an annotated tag would be refused for pointing at "the wrong commit" forever.
                      MIRROR_SHA="$(TAG_JSON="$RUNNER_TEMP/tag.json" "$NODE" <<'NODE'
                    const fs = require('fs');
                    process.stdout.write(JSON.parse(fs.readFileSync(process.env.TAG_JSON, 'utf8')).object.sha + '\n');
          NODE
                    )"
                      MIRROR_TYPE="$(TAG_JSON="$RUNNER_TEMP/tag.json" "$NODE" <<'NODE'
                    const fs = require('fs');
                    process.stdout.write(JSON.parse(fs.readFileSync(process.env.TAG_JSON, 'utf8')).object.type + '\n');
          NODE
                    )"
                      if [ "$MIRROR_TYPE" = "tag" ]; then
                        "$CURL" -q -sS --proto =https --proto-redir =https -o "$RUNNER_TEMP/tagobj.json" "${auth[@]}" "$API/git/tags/$MIRROR_SHA"
                        MIRROR_SHA="$(TAG_JSON="$RUNNER_TEMP/tagobj.json" "$NODE" <<'NODE'
                    const fs = require('fs');
                    process.stdout.write(JSON.parse(fs.readFileSync(process.env.TAG_JSON, 'utf8')).object.sha + '\n');
          NODE
                    )"
                        echo "peeled annotated tag to $MIRROR_SHA"
                      fi
                      printf 'mirror tag\t%s\nbuilt commit\t%s\n' "$MIRROR_SHA" "$TARGET_SHA"
                      if [ "$MIRROR_SHA" != "$TARGET_SHA" ]; then
                        echo "the mirror's $TARGET_TAG is not the commit that was built"; exit 1
                      fi
                    elif [ "$TAG_CODE" = "404" ]; then
                      echo "the mirror has no $TARGET_TAG yet; the release will create it at $TARGET_SHA"
                    else
                      echo "could not read the mirror's tag ref (HTTP $TAG_CODE)"; exit 1
                    fi

                    # An earlier attempt can leave a draft behind, and GitHub allows only one release per tag, so an
          # abandoned draft is cleared rather than worked around.
          #
          # Deliberately NOT `GET /releases/tags/<tag>`: that endpoint does not return drafts at all, so it
          # answers 404 for exactly the release this has to find - which made the first version of this check
          # useless and the following create fail with 422 already_exists. The list endpoint does include
          # drafts for a token with write access, so the matching entries are filtered there.
          LIST_CODE="$("$CURL" -q -sS --proto =https --proto-redir =https -o "$RUNNER_TEMP/releases.json" -w '%{http_code}' \
            "${auth[@]}" "$API/releases?per_page=100")"
          [ "$LIST_CODE" = "200" ] || { echo "could not list the mirror's releases (HTTP $LIST_CODE)"; exit 1; }
          read -r EXIST_COUNT EXIST_STATE EXIST_ID < <(REL_JSON="$RUNNER_TEMP/releases.json" WANT_TAG="$TARGET_TAG" "$NODE" <<'NODE'
          const fs = require('fs');
          const all = JSON.parse(fs.readFileSync(process.env.REL_JSON, 'utf8'));
          const same = all.filter((r) => r.tag_name === process.env.WANT_TAG);
          const live = same.find((r) => r.draft !== true);
          const draft = same.find((r) => r.draft === true);
          process.stdout.write(`${same.length} ${live ? 'published' : (draft ? 'draft' : 'none')} ${live ? live.id : (draft ? draft.id : 0)}\n`);
          NODE
          ) || true
          echo "releases for $TARGET_TAG: count=$EXIST_COUNT state=$EXIST_STATE id=$EXIST_ID"
                      # The release body: the changelog this version already requires, plus what somebody downloading needs -
                      # the Android floor, how to verify the file, the licence and the source. node builds the JSON, so the
                      # markdown is escaped as one string; hand-escaping JSON into a quoted shell word is what broke this
                      # workflow before, when one backslash split the body into words.
                      #
                      # Written before the release-state switch because both paths use it: creating a release needs the body,
                      # and refreshing the description of an already-published one needs the same text.
                      cat > "$RUNNER_TEMP/body.js" <<'BODYJS'
                      const fs = require('fs');
                      const path = require('path');
                      const [tag, sha, apkName, sumName, workspace, mirror] = process.argv.slice(2);
                      const version = String(tag).replace(/^v/, '');

                      const m = /^(\d{4})\.(\d{2})\.(\d{2})(?:\.(\d))?$/.exec(version);
                      let notes = '';
                      if (m) {
                        const code = `${m[1]}${m[2]}${m[3]}${m[4] || '0'}`;
                        const file = path.join(workspace, 'fastlane/metadata/android/en-US/changelogs', `${code}.txt`);
                        try { notes = fs.readFileSync(file, 'utf8').trim(); } catch (e) { notes = ''; }
                      }

                      const footer = [
                        '---',
                        '',
                        '**Requires Android 12 (API 31) or newer.**',
                        '',
                        `Download \`${apkName}\` and open it. Android asks you to allow installs from the app you opened it`,
                        'with; that permission is per-app and can be revoked afterwards. An update installs over the old',
                        'version and keeps your settings.',
                        '',
                        'Check the file:',
                        '',
                        '```',
                        `sha256sum -c ${sumName}`,
                        `apksigner verify --print-certs ${apkName}`,
                        '```',
                        '',
                        `Signed with the project key (\`CN=Roux Sports\`). GPL-3.0-or-later - ` +
                          `[source](https://github.com/${mirror})`,
                      ].join('\n');

                      const body = notes ? `${notes}\n\n${footer}` : footer;
                      process.stdout.write(
                        JSON.stringify({ tag_name: tag, target_commitish: sha, name: `Roux Sports ${version}`, body, draft: true, prerelease: false }),
                      );
          BODYJS

          case "$EXIST_STATE" in
            published)
              # A published release is never overwritten. A second run for the same tag is not a
              # failure when it would publish that same release - it is a redundant run, and it
              # exits successfully so a red badge means something.
              #
              # The comparison is the release's target commit and the presence of both assets, not
              # the bytes: the APK is not reproducible, so a rebuild of the same commit produces a
              # different digest and a byte comparison would refuse every redundant run. A published
              # release for a tag is final; to ship again, bump the version.
              read -r PUB_APK_ID PUB_SUM_ID PUB_ID PUB_TARGET < <(REL_JSON="$RUNNER_TEMP/releases.json" \
                WANT_TAG="$TARGET_TAG" APK_NAME="$(basename "$APK")" SUM_NAME="$(basename "$SUM")" "$NODE" <<'NODE'
          const fs = require('fs');
          const all = JSON.parse(fs.readFileSync(process.env.REL_JSON, 'utf8'));
          const rel = all.find((r) => r.tag_name === process.env.WANT_TAG && r.draft !== true);
          const pick = (n) => {
            const a = (rel.assets || []).find((x) => x.name === n);
            return a ? a.id : 0;
          };
          process.stdout.write(`${pick(process.env.APK_NAME)} ${pick(process.env.SUM_NAME)} ${rel.id} ${rel.target_commitish || ''}\n`);
          NODE
              ) || true
              echo "published release $PUB_ID exists for $TARGET_TAG"
              if printf '%s' "$PUB_TARGET" | grep -Eq '^[0-9a-f]{40}$' && [ "$PUB_TARGET" != "$TARGET_SHA" ]; then
                echo "the published release targets $PUB_TARGET, not the commit built here ($TARGET_SHA)"; exit 1
              fi
              if [ "$PUB_APK_ID" = "0" ] || [ "$PUB_SUM_ID" = "0" ]; then
                echo "the published release is missing $(basename "$APK") or $(basename "$SUM"); refusing to touch a published release"
                exit 1
              fi
              echo "already released: https://github.com/$GITHUB_MIRROR/releases/tag/$TARGET_TAG"
              echo "this run published nothing; a published release for a tag is final"
              # The assets are final; the description is not. Refreshing it here means thin notes can be improved by
              # re-dispatching instead of hand-editing two places. Only the body is patched: nothing on this path can
              # replace an uploaded file.
              BODY_JSON="$("$NODE" "$RUNNER_TEMP/body.js" "$TARGET_TAG" "$TARGET_SHA" \
                "$(basename "$APK")" "$(basename "$SUM")" "$WORKSPACE" "$GITHUB_MIRROR" | \
                "$NODE" -e 'let d="";process.stdin.on("data",(c)=>d+=c).on("end",()=>{const b=JSON.parse(d).body;if(typeof b!=="string"||b.length===0){process.exit(1)}process.stdout.write(JSON.stringify({body:b}))})')" \
                || { echo "could not build the release description"; exit 1; }
              PATCH_CODE="$("$CURL" -q -sS --proto =https --proto-redir =https -o /dev/null -w '%{http_code}' "${auth[@]}" \
                -X PATCH -H 'Content-Type: application/json' -d "$BODY_JSON" "$API/releases/$PUB_ID")"
              echo "refreshed the release description -> $PATCH_CODE"
              [ "$PATCH_CODE" = "200" ] || { echo "could not refresh the release description"; exit 1; }
              exit 0
              ;;
            draft)
              DEL_CODE="$("$CURL" -q -sS --proto =https --proto-redir =https -o /dev/null -w '%{http_code}' "${auth[@]}" \
                -X DELETE "$API/releases/$EXIST_ID")"
              echo "cleared abandoned draft $EXIST_ID -> $DEL_CODE"
              [ "$DEL_CODE" = "204" ] || { echo "could not clear the abandoned draft"; exit 1; }
              ;;
            none) ;;
            *) echo "could not determine the release state"; exit 1 ;;
          esac

          # Draft first: nothing is visible until both assets are uploaded and read back.
                      # The body is built by node and passed as one argument. Hand-escaping JSON into a quoted
                      # shell word is what broke this before: one wrong backslash split the body into words and curl
                      # read a fragment of it as a URL. JSON.stringify cannot make that mistake.
                      BODY="$("$NODE" "$RUNNER_TEMP/body.js" "$TARGET_TAG" "$TARGET_SHA" \
                        "$(basename "$APK")" "$(basename "$SUM")" "$WORKSPACE" "$GITHUB_MIRROR")"
                      CODE="$("$CURL" -q -sS --proto =https --proto-redir =https -o "$RUNNER_TEMP/release.json" -w '%{http_code}' "${auth[@]}" -X POST "$API/releases" -H 'Content-Type: application/json' -d "$BODY")"
                    if [ "$CODE" != "201" ]; then
                      echo "creating the draft release failed (HTTP $CODE)"
                      cat "$RUNNER_TEMP/release.json"
                      exit 1
                    fi
                    RID="$(RELEASE_JSON="$RUNNER_TEMP/release.json" "$NODE" <<'NODE'
                    const fs = require('fs');
                    process.stdout.write(String(JSON.parse(fs.readFileSync(process.env.RELEASE_JSON, 'utf8')).id) + '\n');
          NODE
                    )"
                    UPLOAD_URL="$(RELEASE_JSON="$RUNNER_TEMP/release.json" "$NODE" <<'NODE'
                    const fs = require('fs');
                    process.stdout.write(JSON.parse(fs.readFileSync(process.env.RELEASE_JSON, 'utf8')).upload_url.split('{')[0] + '\n');
          NODE
                    )"
                    echo "draft release id: $RID"

                    : > "$RUNNER_TEMP/asset_ids.txt"
                    upload() {
                      local file="$1" name="$2" code
                      code="$("$CURL" -q -sS --proto =https --proto-redir =https -o "$RUNNER_TEMP/asset.json" -w '%{http_code}' \
                        -H "Authorization: Bearer $RELEASE_PUBLISH_TOKEN" \
                        -H 'Content-Type: application/octet-stream' \
                        -X POST "$UPLOAD_URL?name=$name" --data-binary "@$file")"
                      echo "upload $name -> $code"
                      if [ "$code" != "201" ]; then
                        cat "$RUNNER_TEMP/asset.json"
                        exit 1
                      fi
                      ASSET_JSON="$RUNNER_TEMP/asset.json" "$NODE" <<'NODE' >> "$RUNNER_TEMP/asset_ids.txt"
                    const fs = require('fs');
                    process.stdout.write(String(JSON.parse(fs.readFileSync(process.env.ASSET_JSON, 'utf8')).id) + '\n');
          NODE
                    }

                    upload "$APK" "$(basename "$APK")"
                    upload "$SUM" "$(basename "$SUM")"

                    APK_ID="$(sed -n 1p "$RUNNER_TEMP/asset_ids.txt")"
                    SUM_ID="$(sed -n 2p "$RUNNER_TEMP/asset_ids.txt")"
                    [ -n "$APK_ID" ] && [ -n "$SUM_ID" ] || { echo "asset ids were not recorded"; exit 1; }

                    # Both assets are read back through the API and compared with the files that were built. A
                    # draft's download URLs need auth anyway, so this is the same path a client would use.
                    verify() {
                      local asset_id="$1" local_file="$2" name="$3" a b
                      # -L matters: an asset download answers with a redirect to a signed URL, so without it
                      # curl saves the empty redirect body and the comparison fails against the hash of nothing.
                      "$CURL" -q -sS -L --proto =https --proto-redir =https -H "Authorization: Bearer $RELEASE_PUBLISH_TOKEN" \
                        -H 'Accept: application/octet-stream' \
                        -o "$RUNNER_TEMP/back.bin" "$API/releases/assets/$asset_id"
                      a="$("$SHA" "$local_file" | cut -d' ' -f1)"
                      b="$("$SHA" "$RUNNER_TEMP/back.bin" | cut -d' ' -f1)"
                      printf 'verify %s\n  built  %s\n  stored %s\n' "$name" "$a" "$b"
                      if [ "$a" != "$b" ]; then echo "$name did not round-trip"; exit 1; fi
                      rm -f "$RUNNER_TEMP/back.bin"
                    }

                    verify "$APK_ID" "$APK" "$(basename "$APK")"
                    verify "$SUM_ID" "$SUM" "$(basename "$SUM")"

                    # Verified, so it can be seen.
                    CODE="$("$CURL" -q -sS --proto =https --proto-redir =https -o /dev/null -w '%{http_code}' "${auth[@]}" \
                      -X PATCH "$API/releases/$RID" -H 'Content-Type: application/json' -d '{"draft":false}')"
                    echo "publish -> $CODE"
                    [ "$CODE" = "200" ] || { echo "could not publish the draft release"; exit 1; }

                    CODE="$("$CURL" -q -sS --proto =https --proto-redir =https -o /dev/null -w '%{http_code}' -L \
                      "https://github.com/$GITHUB_MIRROR/releases/download/$TARGET_TAG/$(basename "$SUM")")"
                    echo "public checksum download -> $CODE"
                    [ "$CODE" = "200" ] || { echo "the published download is not reachable"; exit 1; }

                    echo "published: https://github.com/$GITHUB_MIRROR/releases/tag/$TARGET_TAG"
          PUBLISH
          )

          mkdir -p "$RUNNER_TEMP/curldir"
          set +e
          # The tag and commit come from the resolve step, which the build step can write to as well. That is
          # accepted rather than papered over: the build holds the signing key and produces the artifact, so it is
          # trusted with what it says it built. The check that matters is remote - the mirror's own tag ref must
          # point at the commit published here - and a swapped tag name fails it unless the mirror agrees, which
          # would mean the real tag does point at this commit.
          env -i \
            HOME="$RUNNER_TEMP" \
            TMPDIR="$RUNNER_TEMP" \
            CURL_HOME="$RUNNER_TEMP/curldir" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/curldir" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GITHUB_MIRROR="$GITHUB_MIRROR" \
            TARGET_TAG="$TARGET_TAG" \
            TARGET_SHA="$TARGET_SHA" \
            PATH="$PATH" \
            NODE="$NODE" \
            CURL="$CURL" \
            RELEASE_PUBLISH_TOKEN="$RELEASE_PUBLISH_TOKEN" \
            bash --noprofile --norc "$SCRIPT"
          rc=$?
          set -e
          rm -f "$SCRIPT"
          exit "$rc"

  mirror:
    # The same bytes, in this repository. GitHub is where a reader downloads from; this is where the project
    # keeps its own record, and the two must not disagree about what v<version> was.
    #
    # It uploads the artifact the build job produced rather than rebuilding here: a second build of the same
    # commit yields a different APK digest (the build is not reproducible), which would make "the 2026.11.17.1
    # APK" ambiguous - one file in each place, different checksums, both legitimate-looking.
    needs: publish
    runs-on: nixos
    timeout-minutes: 15
    # Creating a release and uploading assets needs write; the workflow's default is read.
    permissions:
      contents: write
    env:
      BASH_ENV: ""
      ENV: ""
    steps:
      - name: Fetch the built APK
        uses: https://data.forgejo.org/actions/download-artifact@v3
        with:
          name: release-apk
          path: dist

      - name: Mirror the release into this repository
        # No checkout in this job, so no code from the tagged commit is present to run with the token in
        # scope. The only input is the two artifact files, both hashed before anything is uploaded.
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          CURL="$(command -v curl || true)"
          NODE="$(command -v node || true)"
          [ -n "$CURL" ] || { echo "curl is not on this runner's PATH"; exit 1; }
          [ -n "$NODE" ] || { echo "node is not on this runner's PATH"; exit 1; }

          TAG="${INPUT_TAG:-${GITHUB_REF_NAME:-}}"
          [ -n "$TAG" ] || { echo "no tag to mirror"; exit 1; }
          API="${GITHUB_API_URL:-https://git.montycasa.net/api/v1}/repos/${GITHUB_REPOSITORY:?}"
          MIRROR_URL="https://github.com/${GITHUB_MIRROR}/releases/tag/${TAG}"

          # The build job ships the APK alone on purpose: the publisher recomputes the checksum from the bytes
          # rather than trusting a sidecar that came out of the tagged checkout. This job follows the same rule,
          # so it derives one here instead of requiring a file that is never in the artifact.
          APK="$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] && [ -f "$APK" ] || { echo "no APK in dist"; exit 1; }
          APK_NAME="$(basename "$APK")"
          APK_SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SUM_NAME="${APK_NAME}.sha256"
          printf '%s  %s\n' "$APK_SHA" "$APK_NAME" > "dist/$SUM_NAME"
          SUM="dist/$SUM_NAME"


          auth=(-H "Authorization: token ${FORGEJO_TOKEN:?}")

          # Does this repository already have the release?
          CODE="$("$CURL" -q -sS --proto =https --proto-redir =https -o "$RUNNER_TEMP/existing.json" \
            -w '%{http_code}' "${auth[@]}" "$API/releases/tags/$TAG")" || { echo "could not read the release"; exit 1; }

          if [ "$CODE" = "404" ]; then
            BODY="Signed release ${TAG}. The assets are byte-identical to the public mirror: ${MIRROR_URL}"
            REL_JSON="$RUNNER_TEMP/rel.json" TAG="$TAG" BODY="$BODY" "$NODE" <<'NODE'
          const fs = require('fs');
          const body = { tag_name: process.env.TAG, name: process.env.TAG, body: process.env.BODY,
                         draft: false, prerelease: false };
          fs.writeFileSync(process.env.REL_JSON, JSON.stringify(body));
          NODE
            CODE="$("$CURL" -q -sS --proto =https --proto-redir =https -o "$RUNNER_TEMP/created.json" \
              -w '%{http_code}' "${auth[@]}" -H 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/rel.json" "$API/releases")"
            [ "$CODE" = "201" ] || { echo "creating the release returned $CODE"; head -c 400 "$RUNNER_TEMP/created.json"; exit 1; }
            cp "$RUNNER_TEMP/created.json" "$RUNNER_TEMP/existing.json"
            echo "created the release for $TAG"
          elif [ "$CODE" != "200" ]; then
            echo "reading the release returned $CODE"; exit 1
          else
            echo "the release for $TAG already exists"
          fi

          read -r REL_ID HAVE_APK HAVE_SUM < <(REL_JSON="$RUNNER_TEMP/existing.json" \
            APK_NAME="$APK_NAME" SUM_NAME="$SUM_NAME" "$NODE" <<'NODE'
          const fs = require('fs');
          const rel = JSON.parse(fs.readFileSync(process.env.REL_JSON, 'utf8'));
          const has = (n) => ((rel.assets || []).some((a) => a.name === n) ? 1 : 0);
          console.log(`${rel.id} ${has(process.env.APK_NAME)} ${has(process.env.SUM_NAME)}`);
          NODE
          )
          [ -n "${REL_ID:-}" ] || { echo "could not read the release id"; exit 1; }

          upload() { # name, path
            local name="$1" path="$2" code
            code="$("$CURL" -q -sS --proto =https --proto-redir =https -o "$RUNNER_TEMP/asset.json" \
              -w '%{http_code}' "${auth[@]}" -H 'Content-Type: application/octet-stream' \
              --data-binary "@$path" "$API/releases/$REL_ID/assets?name=$name")"
            case "$code" in 201|200) echo "uploaded $name" ;; *) echo "uploading $name returned $code"; exit 1 ;; esac
          }
          [ "$HAVE_APK" = "1" ] || upload "$APK_NAME" "$APK"
          [ "$HAVE_SUM" = "1" ] || upload "$SUM_NAME" "$SUM"

          # Read back what the server holds, and compare the APK byte for byte.
          "$CURL" -q -sS --proto =https --proto-redir =https -o "$RUNNER_TEMP/final.json" "${auth[@]}" \
            "$API/releases/tags/$TAG" || { echo "could not read the release back"; exit 1; }
          read -r ASSET_URL SIZE < <(REL_JSON="$RUNNER_TEMP/final.json" APK_NAME="$APK_NAME" "$NODE" <<'NODE'
          const fs = require('fs');
          const rel = JSON.parse(fs.readFileSync(process.env.REL_JSON, 'utf8'));
          const a = (rel.assets || []).find((x) => x.name === process.env.APK_NAME);
          // The asset bytes are served from the release download URL this server advertises. This
          // Forgejo version has no /releases/assets/<id> content endpoint: it answers 404 with a short
          // text body, which a naive read-back hashes happily and then reports as a corrupt upload.
          console.log(a ? `${a.browser_download_url} ${a.size}` : 'NONE 0');
          NODE
          )
          [ "${ASSET_URL:-NONE}" != "NONE" ] || { echo "the release does not carry $APK_NAME"; exit 1; }
          STSIZE="$(stat -c %s "$APK")"
          [ "$SIZE" = "$STSIZE" ] || { echo "stored size $SIZE does not match $STSIZE"; exit 1; }
          "$CURL" -q -sS -L --proto =https --proto-redir =https -o "$RUNNER_TEMP/stored.apk" "${auth[@]}" \
            "$ASSET_URL"
          STORED_SHA="$(sha256sum "$RUNNER_TEMP/stored.apk" | cut -d' ' -f1)"
          [ "$STORED_SHA" = "$APK_SHA" ] || { echo "stored APK digest $STORED_SHA does not match $APK_SHA"; exit 1; }
          rm -f "$RUNNER_TEMP/stored.apk"
          echo "mirrored $TAG: $APK_NAME matches $APK_SHA"
