name: release

# Tag-triggered release: build the signed APK from the tagged commit and publish it on the public
# GitHub mirror, which is where direct downloads and Obtainium read from. The Forgejo instance is
# LAN-only, so a release here is the record of what was built; the GitHub release is the download.
#
# Order matters and is the point of the workflow:
#   1. resolve the target, so a manual dispatch releases the tag it checked out and not the branch the
#      dispatch was fired from.
#   2. preflight refuses a tag that is not on main, does not match versionName, or names a commit with
#      no successful gate run. Nothing is built or published from a commit that has not passed.
#   3. build restores the keystore from secrets, runs the repository's own release script, and checks the
#      signer against a pinned certificate digest.
#   4. publish runs in its own step with its own environment, holding only the GitHub token. It resolves
#      its tools from a fixed PATH and runs no repository script, so nothing from the tagged commit
#      executes with that token in scope.
#   5. the release is created as a draft, both assets are uploaded and read back for comparison, and only
#      then is it published. A corrupt upload therefore cannot go live.
#
# Secrets this needs (Forgejo user-level secrets are visible to both repositories):
#   RELEASE_PUBLISH_TOKEN   GitHub token with contents:write on the mirror
#   RELEASE_KEYSTORE_B64    base64 of the release .jks
#   RELEASE_STORE_PASSWORD  keystore password
#   RELEASE_KEY_PASSWORD    key password
#   RELEASE_KEY_ALIAS       key alias (optional; read out of the keystore when absent)
#
# Known limitation, stated rather than hidden: a push trigger runs the workflow file from the ref being
# built, so whoever can create a tag can also supply the workflow that handles these secrets. Restrict
# who may create release tags (Forgejo tag protection) or move release automation to a ref tags cannot
# override.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v1.0.0
        required: true
        type: string

concurrency:
  # Keyed on the tag itself, so a tag push and a manual dispatch for the same tag serialise instead of
  # racing on the same release assets. Never cancel: a half-published release is worse than a slow one.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_PACKAGE: net.montycasa.roux
  GITHUB_MIRROR: monty033/roux-sports
  # The certificate this project ships. A release signed by anything else is not ours, so the build step
  # fails rather than publishing it. Rotating the signing key means changing this line.
  EXPECTED_CERT_SHA256: 6dd177eef48595e217cc660a72fcb05ca4eae4979d1484936941b01721893a21

jobs:
  build:
    runs-on: nixos
    timeout-minutes: 90
    steps:
      - name: Check out the release target
        uses: actions/checkout@v4
        with:
          # The ancestry check needs main, not just the tag's tree.
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve the target
        # The tag comes from the event, so it is untrusted input: it is passed in the environment (never
        # spliced into shell source) and validated against a strict shape before anything uses it.
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$REQUESTED_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing tag that is not v<major>.<minor>.<patch>: $REQUESTED_TAG"; exit 1 ;;
          esac
          case "$REQUESTED_TAG" in
            *[!0-9A-Za-z._-]*) echo "refusing tag with unexpected characters: $REQUESTED_TAG"; exit 1 ;;
          esac
          # The checked-out tag resolved to a commit. A manual dispatch passes a tag input, but the
          # event's own SHA belongs to the branch it was fired from, so the commit is read from git.
          SHA="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short=8 HEAD)"
          {
            printf 'TARGET_TAG=%s\n' "$REQUESTED_TAG"
            printf 'TARGET_SHA=%s\n' "$SHA"
          } >> "$GITHUB_ENV"
          printf 'tag\t%s\ncommit\t%s\n' "$REQUESTED_TAG" "$SHORT"

      - name: Preflight
        # Read-only. Refuses before any secret is in scope.
        env:
          # Both well-known token names are blanked so a repository script cannot pick one up out of the
          # environment; only the read-only copy below is in scope.
          GITHUB_TOKEN: ""
          FORGEJO_TOKEN: ""
          FORGEJO_READ_TOKEN: ${{ github.token }}
          RUNS_URL: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/runs
        run: |
          set -euo pipefail

          # 1. The tag names a version the app actually carries.
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)"
          [ -n "$VERSION_NAME" ] || { echo "could not read versionName"; exit 1; }
          if [ "v$VERSION_NAME" != "$TARGET_TAG" ]; then
            echo "tag $TARGET_TAG does not match versionName $VERSION_NAME"; exit 1
          fi
          echo "versionName matches: $VERSION_NAME"

          # 2. The tagged commit is on main. A tag on a side branch is an accident, not a release.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$TARGET_SHA" FETCH_HEAD; then
            echo "commit $TARGET_SHA is not on main"; exit 1
          fi
          echo "commit is on main"

          # 3. That commit passed the gate. Runs are selected by workflow id, commit and status - a
          # successful run of something else is not a gate - and paged, because an older tag's gate run
          # can sit well past the first page.
          # Absolute path, not PATH and not `nix develop`: a nix develop fallback would evaluate the
          # flake from the checkout - including its shellHook - with this step's read token in scope.
          PY=/run/current-system/sw/bin/python3
          [ -x "$PY" ] || { echo "python3 is not installed at $PY on this runner"; exit 1; }
          FOUND=0
          for page in 1 2 3 4 5 6 7 8; do
            /run/current-system/sw/bin/curl -q -sS --proto =https -H "Authorization: token $FORGEJO_READ_TOKEN" \
              "$RUNS_URL?limit=50&page=$page" -o "$RUNNER_TEMP/runs.json"
            RESULT="$("$PY" -I - "$TARGET_SHA" "$RUNNER_TEMP/runs.json" <<'PY'
          import json, sys
          sha, path = sys.argv[1], sys.argv[2]
          runs = json.load(open(path)).get("workflow_runs") or []
          gate = [r for r in runs if r.get("workflow_id") == "gate.yml" and r.get("commit_sha") == sha]
          if any(r.get("status") == "success" for r in gate):
              print("found")
          elif not runs:
              print("empty")
          else:
              print("keep")
          PY
          )"
            echo "page $page: $RESULT"
            case "$RESULT" in
              found) FOUND=1; break ;;
              empty) echo "no gate run for this commit"; exit 1 ;;
              keep) ;;
              *) echo "unexpected result from the gate check"; exit 1 ;;
            esac
          done
          if [ "$FOUND" -ne 1 ]; then
            echo "no successful gate run for this commit in 400 runs"; exit 1
          fi
          echo "gate run found"

      - name: Build the signed release
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          # Nothing in this step needs repository or forge write access.
          GITHUB_TOKEN: ""
          FORGEJO_TOKEN: ""
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "RELEASE_KEYSTORE_B64 is not set"; exit 1; }
          [ -n "$STORE_PASSWORD" ] || { echo "RELEASE_STORE_PASSWORD is not set"; exit 1; }

          KEYSTORE="$RUNNER_TEMP/release.jks"
          # 0600 before the bytes land in it.
          ( umask 077; printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE" )
          chmod 600 "$KEYSTORE"

          ALIAS="$KEY_ALIAS"
          if [ -z "$ALIAS" ]; then
            ALIAS="$(nix develop --command keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" \
              | sed -n 's/^\([^,]*\),.*PrivateKeyEntry.*/\1/p' | head -1)"
          fi
          [ -n "$ALIAS" ] || { echo "could not determine the key alias"; exit 1; }

          (
            umask 077
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE" "$STORE_PASSWORD" "$ALIAS" "$KEY_PASSWORD" > keystore.properties
          )
          chmod 600 keystore.properties

          nix develop --command ./scripts/build-release.sh

          # The script proves the APK is signed; this proves it is signed by us.
          APK="$(find app/build/dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo "no APK in app/build/dist"; exit 1; }
          DIGEST="$(nix develop --command apksigner verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          printf 'certificate\t%s\n' "$DIGEST"
          if [ "$DIGEST" != "$EXPECTED_CERT_SHA256" ]; then
            echo "APK is signed by an unexpected certificate"; exit 1
          fi
          sha256sum "$APK"

      - name: Remove the key material
        if: always()
        run: |
          set -uo pipefail
          failed=0
          for f in "$RUNNER_TEMP/release.jks" keystore.properties; do
            if [ -e "$f" ]; then
              shred -u "$f" 2>/dev/null || rm -f "$f"
              if [ -e "$f" ]; then
                echo "could not remove $f"
                failed=1
              fi
            fi
          done
          left="$(find "$RUNNER_TEMP" . -maxdepth 1 -iname '*keystore*' -print 2>/dev/null | grep . || true)"
          if [ -n "$left" ]; then
            echo "key-shaped files still present:"
            printf '%s\n' "$left"
            failed=1
          fi
          if [ "$failed" -eq 0 ]; then echo "key material removed"; else exit 1; fi

      - name: Hand the artifact to the publish job
        # The APK crosses a job boundary so the token-bearing job never shares a process environment with
        # the step that runs code from the tagged commit. The checksum is recomputed on the other side.
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/dist/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    # A separate job on purpose. It starts with an empty environment file, so nothing the build step wrote
    # to it - BASH_ENV, PATH additions, LD_PRELOAD, proxy settings - exists here to be inherited. Belt and
    # braces, the shell that runs this job's steps is also given an empty BASH_ENV and ENV.
    needs: build
    runs-on: nixos
    timeout-minutes: 20
    env:
      BASH_ENV: ""
      ENV: ""
    steps:
      - name: Check out the tag itself
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Resolve the target from the fresh checkout
        # Read from git in this job, not carried over from the build: the commit being published is the one
        # this job checked out, so there is nothing for an earlier step to substitute.
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$REQUESTED_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing tag that is not v<major>.<minor>.<patch>: $REQUESTED_TAG"; exit 1 ;;
          esac
          {
            printf 'TARGET_TAG=%s\n' "$REQUESTED_TAG"
            printf 'TARGET_SHA=%s\n' "$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          printf 'tag\t%s\ncommit\t%s\n' "$REQUESTED_TAG" "$(git rev-parse --short=8 HEAD)"

      - name: Fetch the built APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist

      - name: Publish to the GitHub mirror
        # Holds the GitHub token and nothing else. An explicit PATH replaces the runner's own, so a
        # directory an earlier step added to GITHUB_PATH is not searched, and no repository script runs
        # here: the token cannot reach code from the tagged commit through this step's environment.
        env:
          # The only variable this step's shell is given. The publisher itself runs under `env -i` with an
          # explicit list, so nothing inherited from the build step reaches it.
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          TOOLS=/run/current-system/sw/bin
          [ -x "$TOOLS/bash" ] || { echo "no bash in $TOOLS"; exit 1; }

          # The publisher is written out first, then run with an empty environment. Forgejo carries
          # environment updates from an earlier step into later ones, and the build step runs code from the
          # tagged commit, so anything it writes there - LD_PRELOAD, a proxy, a curl config - would
          # otherwise be inherited by the process that holds the publish token. This list is the entire
          # environment the publisher gets.
          SCRIPT="$RUNNER_TEMP/publish.sh"
          ( umask 077; "$TOOLS/cat" > "$SCRIPT" <<'PUBLISH'
                    # Every tool is addressed absolutely and must resolve into the immutable store. The build step
                    # runs tagged code and can add path entries that later steps inherit, so "which curl" is an
                    # input this step does not trust.
                    TOOLS="${TOOLS:-/run/current-system/sw/bin}"
                    for tool in python3 curl sha256sum find basename sed cat rm; do
                      path="$TOOLS/$tool"
                      [ -x "$path" ] || { echo "$tool is not at $path"; exit 1; }
                      case "$(readlink -f "$path")" in
                        /nix/store/*) ;;
                        *) echo "$tool does not resolve into the store: $(readlink -f "$path")"; exit 1 ;;
                      esac
                    done
                    PY="$TOOLS/python3"
                    CURL="$TOOLS/curl"
                    SHA="$TOOLS/sha256sum"

                    # Run from outside the checkout and use -I. Python puts the current directory on sys.path for
                    # -c, and imports sitecustomize at startup, so a tagged json.py or sitecustomize.py would
                    # otherwise run inside this step with the publish token in its environment.
                    WORKSPACE="$GITHUB_WORKSPACE"
                    [ -n "$WORKSPACE" ] || { echo "GITHUB_WORKSPACE is not set"; exit 1; }
                    cd "$RUNNER_TEMP"

                    API="https://api.github.com/repos/$GITHUB_MIRROR"
                    auth=(-H "Authorization: Bearer $RELEASE_PUBLISH_TOKEN" -H "Accept: application/vnd.github+json")

                    APK="$("$TOOLS/find" "$WORKSPACE/dist" -maxdepth 1 -type f -name '*.apk' -print -quit)"
                    [ -n "$APK" ] || { echo "no APK in app/build/dist"; exit 1; }
                    [ -f "$APK" ] || { echo "no APK at $APK"; exit 1; }
                    [ ! -L "$APK" ] || { echo "the APK is a symlink; refusing to upload it"; exit 1; }
                    # The built file names the version it carries, so it is a second, cheap check that the
                    # artifact and the tag describe the same release.
                    if [ "$("$TOOLS/basename" "$APK")" != "roux-sports-${TARGET_TAG#v}.apk" ]; then
                      echo "APK name $("$TOOLS/basename" "$APK") does not match tag $TARGET_TAG"
                      exit 1
                    fi
                    # The sidecar is not trusted: a symlink there could point at this process's own environment and
                    # be uploaded as the checksum. The checksum is computed from the APK and written here instead.
                    SUM="$RUNNER_TEMP/$("$TOOLS/basename" "$APK").sha256"
                    "$SHA" "$APK" | "$TOOLS/sed" "s| .*|  $("$TOOLS/basename" "$APK")|" > "$SUM"
                    "$TOOLS/cat" "$SUM"

                    # If the mirror already has this tag, it must point at the commit that was built. A push mirror
                    # that is behind, or a tag pointing elsewhere, would publish an APK for the wrong source.
                    TAG_CODE="$("$CURL" -q -sS --proto =https --proto-redir =https -o "$RUNNER_TEMP/tag.json" -w '%{http_code}' "${auth[@]}" \
                      "$API/git/ref/tags/$TARGET_TAG")"
                    if [ "$TAG_CODE" = "200" ]; then
                      # The ref may point at the commit (lightweight tag) or at a tag object (annotated tag); peel
                      # it, or an annotated tag would be refused for pointing at "the wrong commit" forever.
                      MIRROR_SHA="$("$PY" -I -c 'import json,sys; obj = json.load(open(sys.argv[1]))["object"]; print(obj["sha"])' "$RUNNER_TEMP/tag.json")"
                      MIRROR_TYPE="$("$PY" -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["object"]["type"])' "$RUNNER_TEMP/tag.json")"
                      if [ "$MIRROR_TYPE" = "tag" ]; then
                        "$CURL" -q -sS --proto =https --proto-redir =https -o "$RUNNER_TEMP/tagobj.json" "${auth[@]}" "$API/git/tags/$MIRROR_SHA"
                        MIRROR_SHA="$("$PY" -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["object"]["sha"])' "$RUNNER_TEMP/tagobj.json")"
                        echo "peeled annotated tag to $MIRROR_SHA"
                      fi
                      printf 'mirror tag\t%s\nbuilt commit\t%s\n' "$MIRROR_SHA" "$TARGET_SHA"
                      if [ "$MIRROR_SHA" != "$TARGET_SHA" ]; then
                        echo "the mirror's $TARGET_TAG is not the commit that was built"; exit 1
                      fi
                    elif [ "$TAG_CODE" = "404" ]; then
                      echo "the mirror has no $TARGET_TAG yet; the release will create it at $TARGET_SHA"
                    else
                      echo "could not read the mirror's tag ref (HTTP $TAG_CODE)"; exit 1
                    fi

                    # Draft first: nothing is visible until both assets are uploaded and read back.
                    CODE="$("$CURL" -q -sS --proto =https --proto-redir =https -o "$RUNNER_TEMP/release.json" -w '%{http_code}' "${auth[@]}" \
                      -X POST "$API/releases" -H 'Content-Type: application/json' \
                      -d "{\"tag_name\":\"$TARGET_TAG\",\"target_commitish\":\"$TARGET_SHA\",\"name\":\"Roux Sports ${TARGET_TAG#v}\",\"draft\":true,\"prerelease\":false}")"
                    if [ "$CODE" != "201" ]; then
                      echo "creating the draft release failed (HTTP $CODE)"
                      "$TOOLS/cat" "$RUNNER_TEMP/release.json"
                      exit 1
                    fi
                    RID="$("$PY" -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/release.json")"
                    UPLOAD_URL="$("$PY" -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["upload_url"].split("{")[0])' "$RUNNER_TEMP/release.json")"
                    echo "draft release id: $RID"

                    : > "$RUNNER_TEMP/asset_ids.txt"
                    upload() {
                      local file="$1" name="$2" code
                      code="$("$CURL" -q -sS --proto =https --proto-redir =https -o "$RUNNER_TEMP/asset.json" -w '%{http_code}' \
                        -H "Authorization: Bearer $RELEASE_PUBLISH_TOKEN" \
                        -H 'Content-Type: application/octet-stream' \
                        -X POST "$UPLOAD_URL?name=$name" --data-binary "@$file")"
                      echo "upload $name -> $code"
                      if [ "$code" != "201" ]; then
                        "$TOOLS/cat" "$RUNNER_TEMP/asset.json"
                        exit 1
                      fi
                      "$PY" -I -c 'import json,sys; asset = json.load(open(sys.argv[1])); print(asset["id"])' "$RUNNER_TEMP/asset.json" >> "$RUNNER_TEMP/asset_ids.txt"
                    }

                    upload "$APK" "$("$TOOLS/basename" "$APK")"
                    upload "$SUM" "$("$TOOLS/basename" "$SUM")"

                    APK_ID="$("$TOOLS/sed" -n 1p "$RUNNER_TEMP/asset_ids.txt")"
                    SUM_ID="$("$TOOLS/sed" -n 2p "$RUNNER_TEMP/asset_ids.txt")"
                    [ -n "$APK_ID" ] && [ -n "$SUM_ID" ] || { echo "asset ids were not recorded"; exit 1; }

                    # Both assets are read back through the API and compared with the files that were built. A
                    # draft's download URLs need auth anyway, so this is the same path a client would use.
                    verify() {
                      local asset_id="$1" local_file="$2" name="$3" a b
                      "$CURL" -q -sS --proto =https --proto-redir =https -H "Authorization: Bearer $RELEASE_PUBLISH_TOKEN" \
                        -H 'Accept: application/octet-stream' \
                        -o "$RUNNER_TEMP/back.bin" "$API/releases/assets/$asset_id"
                      a="$("$SHA" "$local_file" | cut -d' ' -f1)"
                      b="$("$SHA" "$RUNNER_TEMP/back.bin" | cut -d' ' -f1)"
                      printf 'verify %s\n  built  %s\n  stored %s\n' "$name" "$a" "$b"
                      if [ "$a" != "$b" ]; then echo "$name did not round-trip"; exit 1; fi
                      "$TOOLS/rm" -f "$RUNNER_TEMP/back.bin"
                    }

                    verify "$APK_ID" "$APK" "$("$TOOLS/basename" "$APK")"
                    verify "$SUM_ID" "$SUM" "$("$TOOLS/basename" "$SUM")"

                    # Verified, so it can be seen.
                    CODE="$("$CURL" -q -sS --proto =https --proto-redir =https -o /dev/null -w '%{http_code}' "${auth[@]}" \
                      -X PATCH "$API/releases/$RID" -H 'Content-Type: application/json' -d '{"draft":false}')"
                    echo "publish -> $CODE"
                    [ "$CODE" = "200" ] || { echo "could not publish the draft release"; exit 1; }

                    CODE="$("$CURL" -q -sS --proto =https --proto-redir =https -o /dev/null -w '%{http_code}' -L \
                      "https://github.com/$GITHUB_MIRROR/releases/download/$TARGET_TAG/$("$TOOLS/basename" "$SUM")")"
                    echo "public checksum download -> $CODE"
                    [ "$CODE" = "200" ] || { echo "the published download is not reachable"; exit 1; }

                    echo "published: https://github.com/$GITHUB_MIRROR/releases/tag/$TARGET_TAG"
          PUBLISH
          )

          "$TOOLS/mkdir" -p "$RUNNER_TEMP/curldir"
          set +e
          # The tag and commit come from the resolve step, which the build step can write to as well. That is
          # accepted rather than papered over: the build holds the signing key and produces the artifact, so it is
          # trusted with what it says it built. The check that matters is remote - the mirror's own tag ref must
          # point at the commit published here - and a swapped tag name fails it unless the mirror agrees, which
          # would mean the real tag does point at this commit.
          [ -x "$TOOLS/env" ] || { echo "no env in $TOOLS"; exit 1; }
          "$TOOLS/env" -i \
            HOME="$RUNNER_TEMP" \
            TMPDIR="$RUNNER_TEMP" \
            CURL_HOME="$RUNNER_TEMP/curldir" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/curldir" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GITHUB_MIRROR="$GITHUB_MIRROR" \
            TARGET_TAG="$TARGET_TAG" \
            TARGET_SHA="$TARGET_SHA" \
            TOOLS="$TOOLS" \
            PATH="$TOOLS" \
            RELEASE_PUBLISH_TOKEN="$RELEASE_PUBLISH_TOKEN" \
            "$TOOLS/bash" --noprofile --norc "$SCRIPT"
          rc=$?
          set -e
          "$TOOLS/rm" -f "$SCRIPT"
          exit "$rc"
