# Pin policy: newest minor at least two weeks old, at its latest patch.
# Where the newest minor is only days old, the previous minor is pinned and marked with a dagger (†).
# If a pin later fails checkAarMetadata, step down one minor and record the reason here.

[versions]
# The Gradle version is authoritative in gradle/wrapper/gradle-wrapper.properties,
# which pins the distribution and its checksum. This entry records the same
# version so the catalog carries every pin the plan lists; the two must agree.
# Kotlin's published compatibility table lists KGP 2.4.21 as fully supported
# through Gradle 9.7.0, while this project builds on 9.8.2 - chosen because AGP
# 9.4.1 requires at least 9.6.0. The pairing is accepted deliberately and tested
# by the first Kotlin compile in S0.5; if that fails, step the wrapper back to
# 9.7.0, which still satisfies AGP, and record it here.
gradle = "9.8.2"
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
navigationCompose = "2.10.2"
coreKtx = "1.19.1"
work = "2.12.0"
datastore = "1.2.1"
ktor = "3.6.0"
kotlinxSerialization = "1.11.0"
coroutines = "1.11.0"
datetime = "0.8.0"
okio = "3.18.2"
coil = "3.6.3"
robolectric = "4.17"
roborazzi = "1.76.0"
junit = "4.13.2"
turbine = "1.2.1"
spotless = "8.10.4"
ktlint = "1.8.0"
# Android toolchain pins below are read by the module build files added in S0.5
# onward (:domain, :data, :app). They live here from the start so the SDK levels
# and the bytecode target are decided once, in one file, rather than per module.
compileSdk = "37"
targetSdk = "36"
minSdk = "31"
buildTools = "36.0.0"
jvmTarget = "17"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }
ktor-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-svg = { group = "io.coil-kt.coil3", name = "coil-svg", version.ref = "coil" }
coil-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
