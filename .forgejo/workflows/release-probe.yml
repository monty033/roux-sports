name: release-probe

# Temporary diagnostic: the release workflow fails a few seconds in and the job logs cannot be read over the
# API from here, so each stage runs as its own dispatch and the run's pass/fail answers one question.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: checkout | resolve | tools | preflight
        required: true
        type: string
      tag:
        description: release tag
        required: false
        type: string

jobs:
  probe:
    runs-on: nixos
    timeout-minutes: 10
    steps:
      - name: Check out
        if: inputs.stage == 'checkout' || inputs.stage == 'resolve' || inputs.stage == 'tools' || inputs.stage == 'preflight'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve the target
        if: inputs.stage == 'resolve' || inputs.stage == 'tools' || inputs.stage == 'preflight'
        env:
          INPUT_TAG: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          echo "ref=${GITHUB_REF:-unset} ref_name=${GITHUB_REF_NAME:-unset} sha=${GITHUB_SHA:-unset}"
          git fetch --quiet --depth=1 origin "refs/tags/v1.0.0"
          git checkout --quiet FETCH_HEAD
          echo "checked out $(git rev-parse --short=8 HEAD)"
          echo "versionName: $(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)"
          if git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then echo "on main"; else echo "NOT on main"; fi

      - name: Check the tools
        if: inputs.stage == 'tools' || inputs.stage == 'preflight'
        run: |
          set -eu
          echo "PATH=$PATH"
          for t in node curl git sha256sum awk; do
            p="$(command -v "$t" || true)"
            echo "$t -> ${p:-MISSING}"
            [ -n "$p" ] || exit 1
          done
          node --version

      - name: keystore-present
        if: inputs.stage == 'keystore-present'
        env:
          VALUE: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -eu
          echo "KEYSTORE_B64 length=${#VALUE}"
          [ -n "$VALUE" ] || { echo "KEYSTORE_B64 is EMPTY"; exit 1; }
      - name: store-present
        if: inputs.stage == 'store-present'
        env:
          VALUE: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -eu
          echo "STORE_PASSWORD length=${#VALUE}"
          [ -n "$VALUE" ] || { echo "STORE_PASSWORD is EMPTY"; exit 1; }
      - name: key-present
        if: inputs.stage == 'key-present'
        env:
          VALUE: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          echo "KEY_PASSWORD length=${#VALUE}"
          [ -n "$VALUE" ] || { echo "KEY_PASSWORD is EMPTY"; exit 1; }
      - name: token-present
        if: inputs.stage == 'token-present'
        env:
          VALUE: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -eu
          echo "PUBLISH_TOKEN length=${#VALUE}"
          [ -n "$VALUE" ] || { echo "PUBLISH_TOKEN is EMPTY"; exit 1; }
      - name: keystore-magic
        if: inputs.stage == 'keystore-magic'
        env:
          VALUE: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          set -eu
          VALUE="$VALUE" node <<'NODE'
          const b64 = process.env.VALUE.replace(/\s+/g, '');
          const buf = Buffer.from(b64, 'base64');
          console.log(`decoded bytes=${buf.length} magic=${buf.subarray(0, 4).toString('hex')}`);
          // A keystore is either JKS (feedfeed) or PKCS12 (DER, 3082...). This project's is PKCS12, and an
          // earlier version of this check asserted JKS only, so it rejected a perfectly good key.
          const magic = buf.subarray(0, 4).toString('hex');
          if (buf.length < 1000) { console.error('too small'); process.exit(1); }
          if (magic !== 'feedfeed' && !magic.startsWith('3082')) {
            console.error(`not a keystore: magic ${magic}`);
            process.exit(1);
          }
          NODE
      - name: tag-by-expression
        if: inputs.stage == 'tag-expr'
        run: |
          set -eu
          # What the release workflow does today: substitute the input into the shell.
          TAG="${{ inputs.tag }}"
          echo "expression gave: [$TAG]"
          [ "$TAG" = "v1.0.0" ] || { echo "expression did not give the tag"; exit 1; }

      - name: tag-by-event-payload
        if: inputs.stage == 'tag-event'
        run: |
          set -eu
          # Read it out of the event JSON instead of substituting into the shell.
          TAG="$(EVENT_PATH="$GITHUB_EVENT_PATH" node -e 'const e=require(process.env.EVENT_PATH);const t=(e.inputs&&e.inputs.tag)||e.ref_name||"";process.stdout.write(t)')"
          echo "event payload gave: [$TAG]"
          [ "$TAG" = "v1.0.0" ] || { echo "event payload did not give the tag"; exit 1; }

      - name: real-preflight
        if: inputs.stage == 'real'
        env:
          TARGET_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          FORGEJO_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "tag=$TARGET_TAG sha=$TARGET_SHA"
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)"
          [ -n "$VERSION_NAME" ] || { echo "FAIL: could not read versionName"; exit 1; }
          [ "v$VERSION_NAME" = "$TARGET_TAG" ] || { echo "FAIL: tag $TARGET_TAG vs versionName $VERSION_NAME"; exit 1; }
          git fetch --quiet origin main || { echo "FAIL: could not fetch origin main"; exit 1; }
          git merge-base --is-ancestor "$TARGET_SHA" FETCH_HEAD || { echo "FAIL: $TARGET_SHA is not on main"; exit 1; }
          [ -n "${FORGEJO_READ_TOKEN:-}" ] || { echo "FAIL: github.token is empty"; exit 1; }
          RUNS_URL="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/runs"
          NODE="$(command -v node)"; CURL="$(command -v curl)"
          FOUND=0
          for page in 1 2 3 4 5 6 7 8; do
            "$CURL" -q -sS --proto =http,https -H "Authorization: token $FORGEJO_READ_TOKEN" \
              "$RUNS_URL?limit=50&page=$page" -o "$RUNNER_TEMP/runs.json" || { echo "FAIL: curl page $page"; exit 1; }
            RESULT="$(RUNS_JSON="$RUNNER_TEMP/runs.json" GATE_SHA="$TARGET_SHA" "$NODE" -e '
              const fs=require("fs");
              const runs=JSON.parse(fs.readFileSync(process.env.RUNS_JSON,"utf8")).workflow_runs||[];
              const gate=runs.filter(r=>r.workflow_id==="gate.yml"&&r.commit_sha===process.env.GATE_SHA);
              if(gate.some(r=>r.status==="success"))console.log("found");
              else if(!runs.length)console.log("empty");
              else console.log("keep");')"
            case "$RESULT" in
              found) FOUND=1; break ;;
              empty) echo "FAIL: no gate runs visible"; exit 1 ;;
              keep) ;;
              *) echo "FAIL: unexpected [$RESULT]"; exit 1 ;;
            esac
          done
          [ "$FOUND" -eq 1 ] || { echo "FAIL: no successful gate run for $TARGET_SHA"; exit 1; }
          echo "PASS: preflight"

      - name: pf-version
        if: inputs.stage == 'pf-version'
        env:
          TARGET_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          FORGEJO_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)"
          echo "versionName=[$V] tag=[$TARGET_TAG]"
          [ -n "$V" ] && [ "v$V" = "$TARGET_TAG" ]

      - name: pf-main
        if: inputs.stage == 'pf-main'
        env:
          TARGET_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          FORGEJO_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "$TARGET_SHA" FETCH_HEAD
          echo "$TARGET_SHA is on main"

      - name: pf-token
        if: inputs.stage == 'pf-token'
        env:
          TARGET_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          FORGEJO_READ_TOKEN: ${{ github.token }}
        run: |
          set -eu
          echo "token length=${#FORGEJO_READ_TOKEN}"
          [ -n "${FORGEJO_READ_TOKEN:-}" ]

      - name: pf-api
        if: inputs.stage == 'pf-api'
        env:
          TARGET_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          FORGEJO_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/runs"
          echo "url=$URL"
          curl -q -sS --proto =http,https -H "Authorization: token $FORGEJO_READ_TOKEN" "$URL?limit=1" -o "$RUNNER_TEMP/r.json"
          head -c 120 "$RUNNER_TEMP/r.json"; echo
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/r.json","utf8"));if(!Array.isArray(r.workflow_runs))process.exit(1);console.log("runs="+r.workflow_runs.length)'

      - name: pf-gate
        if: inputs.stage == 'pf-gate'
        env:
          TARGET_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          FORGEJO_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/runs"
          for page in 1 2 3 4 5 6 7 8; do
            curl -q -sS --proto =http,https -H "Authorization: token $FORGEJO_READ_TOKEN" "$URL?limit=50&page=$page" -o "$RUNNER_TEMP/r.json"
            OUT="$(RUNS_JSON="$RUNNER_TEMP/r.json" GATE_SHA="$TARGET_SHA" node -e 'const fs=require("fs");const runs=JSON.parse(fs.readFileSync(process.env.RUNS_JSON,"utf8")).workflow_runs||[];const g=runs.filter(r=>r.workflow_id==="gate.yml"&&r.commit_sha===process.env.GATE_SHA);if(g.some(r=>r.status==="success"))console.log("found");else if(!runs.length)console.log("empty");else console.log("keep")')"
            echo "page $page: $OUT"
            case "$OUT" in found) exit 0;; empty) exit 1;; esac
          done
          echo "no gate run"; exit 1

      - name: Preflight API read
        if: inputs.stage == 'preflight'
        env:
          FORGEJO_READ_TOKEN: ${{ github.token }}
          RUNS_URL: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/runs
        run: |
          set -euo pipefail
          NODE="$(command -v node)"
          CURL="$(command -v curl)"
          SHA="$(git rev-parse HEAD)"
          "$CURL" -q -sS --proto =http,https -H "Authorization: token $FORGEJO_READ_TOKEN" \
            "$RUNS_URL?limit=50&page=1" -o "$RUNNER_TEMP/runs.json"
          head -c 200 "$RUNNER_TEMP/runs.json"; echo
          RUNS_JSON="$RUNNER_TEMP/runs.json" GATE_SHA="$SHA" "$NODE" <<'NODE'
          const fs = require('fs');
          const runs = JSON.parse(fs.readFileSync(process.env.RUNS_JSON, 'utf8')).workflow_runs || [];
          const hit = runs.filter((r) =>
            r.workflow_id === 'gate.yml' &&
            r.commit_sha === process.env.GATE_SHA &&
            r.status === 'success').length;
          console.log(`runs=${runs.length} gate_success_for_commit=${hit}`);
          NODE
